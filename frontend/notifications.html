<!doctype html>
<html lang="ar" dir="rtl" class="light-style layout-navbar-fixed layout-menu-fixed layout-compact" data-roles="*">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>الإشعارات</title>
  <script src="/app/js/head.js"></script>
  <script src="/assets/vendor/js/helpers.js"></script>
</head>
<body>
  <main id="page" data-title="الإشعارات" data-en-title="Notifications">
    <div class="card">
      <div class="card-header d-flex flex-wrap gap-2 justify-content-between align-items-center">
        <ul class="nav nav-pills" id="tabs">
          <li class="nav-item"><button class="nav-link active" data-unread=""><span data-en="All">الكل</span></button></li>
          <li class="nav-item"><button class="nav-link" data-unread="1"><span data-en="Unread">غير المقروءة</span></button></li>
        </ul>
        <button class="btn btn-sm btn-label-primary" id="readAll"><i class="ti ti-checks me-1"></i><span data-en="Mark all read">تعليم الكل كمقروء</span></button>
      </div>
      <ul class="list-group list-group-flush" id="list"></ul>
      <div class="card-footer text-center"><button class="btn btn-sm btn-label-secondary d-none" id="more" data-en="Load more">المزيد</button></div>
    </div>
  </main>
  <script src="/assets/vendor/core.bundle.js"></script>
  <script src="/app/js/core.js"></script>
  <script src="/app/js/shell.js"></script>
  <script>
    (function () {
      var t = App.t, esc = App.esc, list = App.$('#list'), unread = '', page = 1;
      function row(n) {
        var ic = App.notifIcon(n.kind);
        return '<li class="list-group-item list-group-item-action d-flex gap-3 py-3 cursor-pointer ' + (n.is_read ? '' : 'bg-label-primary bg-opacity-10') + '" data-id="' + n.id + '" data-link="' + esc(n.link) + '">' +
          '<div class="avatar flex-shrink-0"><span class="avatar-initial rounded-circle bg-label-' + ic[1] + '"><i class="ti ' + ic[0] + '"></i></span></div>' +
          '<div class="flex-grow-1"><div class="d-flex justify-content-between gap-2"><h6 class="mb-1">' + esc(n.title) + '</h6><small class="text-muted text-nowrap">' + esc(App.relTime(n.created_at)) + '</small></div>' +
          '<p class="mb-0 small">' + esc(n.body) + '</p></div>' + (n.is_read ? '' : '<span class="badge badge-dot bg-primary align-self-center"></span>') + '</li>';
      }
      function load(reset) {
        if (reset) { page = 1; list.innerHTML = '<li class="list-group-item"><div class="text-center py-4"><div class="spinner-border text-primary"></div></div></li>'; }
        App.get('/notifications/', { unread: unread, page: page }).then(function (d) {
          if (reset) list.innerHTML = '';
          if (!d.count) { list.innerHTML = '<li class="list-group-item"><div class="smi-empty"><i class="ti ti-bell-off"></i><p class="mb-0">' + esc(t('لا توجد إشعارات', 'No notifications')) + '</p></div></li>'; }
          list.insertAdjacentHTML('beforeend', d.results.map(row).join(''));
          App.$('#more').classList.toggle('d-none', !d.next);
          App.$$('li[data-id]', list).forEach(function (li) {
            li.onclick = function () { App.post('/notifications/' + li.dataset.id + '/read/').finally(function () { if (li.dataset.link) location.href = li.dataset.link; else load(true); }); };
          });
        });
      }
      App.$$('#tabs .nav-link').forEach(function (b) { b.onclick = function () { App.$$('#tabs .nav-link').forEach(function (x) { x.classList.remove('active'); }); b.classList.add('active'); unread = b.dataset.unread; load(true); }; });
      App.$('#readAll').onclick = function () { App.post('/notifications/read-all/').then(function () { load(true); }); };
      App.$('#more').onclick = function () { page++; load(false); };
      document.addEventListener('smi:notification', function () { load(true); });
      load(true);
    })();
  </script>
</body>
</html>
