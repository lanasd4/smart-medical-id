<!doctype html>
<html lang="ar" dir="rtl" class="light-style layout-navbar-fixed layout-menu-fixed layout-compact" data-roles="*">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>حسابي</title>
  <script src="/app/js/head.js"></script>
  <script src="/assets/vendor/js/helpers.js"></script>
</head>
<body>
  <main id="page" data-title="حسابي والإعدادات" data-en-title="Account & settings">
    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card mb-4">
          <div class="card-body text-center pt-5">
            <div id="avatarBox" class="d-flex justify-content-center mb-3"></div>
            <h5 class="mb-1" id="fullName"></h5>
            <span class="badge bg-label-primary" id="roleBadge"></span>
            <ul class="list-unstyled text-start small mt-4 mb-0" id="info"></ul>
          </div>
        </div>
        <div class="card">
          <div class="card-body">
            <h6 class="smi-section-title"><i class="ti ti-device-mobile"></i><span data-en="This device">هذا الجهاز</span></h6>
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div><div class="fw-medium" data-en="Notifications">الإشعارات</div><small class="text-muted" id="pushState"></small></div>
              <button class="btn btn-sm btn-primary" id="pushBtn"></button>
            </div>
            <button class="btn btn-sm btn-label-secondary w-100 mb-2 d-none" id="testPush"><i class="ti ti-bell-ringing me-1"></i><span data-en="Show a test notification">عرض إشعار تجريبي</span></button>
            <button class="btn btn-sm btn-label-primary w-100 d-none" id="installBtn"><i class="ti ti-device-mobile-down me-1"></i><span data-en="Install the app">تثبيت التطبيق على هذا الجهاز</span></button>
            <p class="small text-muted mb-0 mt-2 d-none" id="iosHint" data-en="On iPhone: tap Share then 'Add to Home Screen'.">على آيفون: اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».</p>
          </div>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="card mb-4 d-none" id="contactCard">
          <div class="card-header"><h5 class="card-title mb-0" data-en="Contact details">بيانات التواصل</h5></div>
          <div class="card-body">
            <form id="contactForm" class="row g-3">
              <div class="col-md-6"><label class="form-label" data-en="Phone">الهاتف</label><input class="form-control" name="phone" type="tel" dir="ltr" /></div>
              <div class="col-md-6"><label class="form-label" data-en="Email">البريد الإلكتروني</label><input class="form-control" name="email" type="email" dir="ltr" /></div>
              <div class="col-12"><label class="form-label" data-en="Address">العنوان</label><input class="form-control" name="address" /></div>
              <div class="col-12"><small class="text-muted" data-en="Other details of your medical identity are updated by the clinic.">باقي بيانات هويتك الطبية تحدّثها العيادة.</small></div>
              <div class="col-12"><button class="btn btn-primary" type="submit" data-en="Save">حفظ</button></div>
            </form>
          </div>
        </div>
        <div class="card mb-4">
          <div class="card-header"><h5 class="card-title mb-0" data-en="Change password">تغيير كلمة المرور</h5></div>
          <div class="card-body">
            <form id="pwForm" class="row g-3">
              <div class="col-md-4"><label class="form-label" data-en="Current password">كلمة المرور الحالية</label><input class="form-control" name="old_password" type="password" autocomplete="current-password" required /></div>
              <div class="col-md-4"><label class="form-label" data-en="New password">كلمة المرور الجديدة</label><input class="form-control" name="new_password" type="password" autocomplete="new-password" required /></div>
              <div class="col-md-4"><label class="form-label" data-en="Confirm">تأكيد كلمة المرور</label><input class="form-control" name="confirm" type="password" autocomplete="new-password" required /></div>
              <div class="col-12"><button class="btn btn-primary" type="submit" data-en="Change password">تغيير كلمة المرور</button></div>
            </form>
          </div>
        </div>
        <div class="card">
          <div class="card-header"><h5 class="card-title mb-0" data-en="Preferences">التفضيلات</h5></div>
          <div class="card-body row g-3">
            <div class="col-md-6"><label class="form-label" data-en="Language">اللغة</label>
              <select class="form-select" id="langSel"><option value="ar">العربية</option><option value="en">English</option></select></div>
            <div class="col-md-6"><label class="form-label" data-en="Appearance">المظهر</label>
              <select class="form-select" id="themeSel"><option value="light" data-en="Light">فاتح</option><option value="dark" data-en="Dark">داكن</option><option value="system" data-en="System">حسب الجهاز</option></select></div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="/assets/vendor/core.bundle.js"></script>
  <script src="/app/js/core.js"></script>
  <script src="/app/js/shell.js"></script>
  <script>
    (function () {
      var t = App.t, esc = App.esc, u = App.user();
      App.$('#avatarBox').innerHTML = App.avatar(u.full_name, 'primary', 'avatar-xl');
      App.$('#fullName').textContent = u.full_name;
      App.$('#roleBadge').textContent = { Patient: t('مريض', 'Patient'), Doctor: t('طبيب', 'Doctor'), Nurse: t('ممرض/ة', 'Nurse'), Admin: t('مشرف', 'Admin') }[u.role] || u.role;
      var info = [['ti-user', u.username]];
      if (u.medical_id) info.push(['ti-id', u.medical_id]);
      if (u.specialty_label) info.push(['ti-stethoscope', u.specialty_label]);
      if (u.email) info.push(['ti-mail', u.email]);
      App.$('#info').innerHTML = info.map(function (x) { return '<li class="mb-2"><i class="ti ' + x[0] + ' me-2 text-muted"></i><span class="ltr">' + esc(x[1]) + '</span></li>'; }).join('');

      if (u.role === 'Patient') {
        App.$('#contactCard').classList.remove('d-none');
        App.get('/patients/me/').then(function (p) { App.fillForm(App.$('#contactForm'), p); });
        App.$('#contactForm').addEventListener('submit', function (e) {
          e.preventDefault(); var f = this, b = f.querySelector('button'); App.busy(b, true);
          App.patch('/patients/me/', App.formData(f)).then(function () { App.toast(t('تم الحفظ', 'Saved')); })
            .catch(function (err) { App.formErrors(f, err); }).finally(function () { App.busy(b, false); });
        });
      }
      App.$('#pwForm').addEventListener('submit', function (e) {
        e.preventDefault(); var f = this, d = App.formData(f), b = f.querySelector('button');
        if (d.new_password !== d.confirm) { App.formErrors(f, { data: { confirm: [t('كلمتا المرور غير متطابقتين', 'Passwords do not match')] } }); return; }
        App.busy(b, true);
        App.post('/me/password/', { old_password: d.old_password, new_password: d.new_password }).then(function () { f.reset(); App.toast(t('تم تغيير كلمة المرور', 'Password changed')); })
          .catch(function (err) { App.formErrors(f, err); }).finally(function () { App.busy(b, false); });
      });

      App.$('#langSel').value = App.lang();
      App.$('#langSel').onchange = function () { App.setLang(this.value); };
      App.$('#themeSel').value = localStorage.getItem('smi_theme') || 'light';
      App.$('#themeSel').onchange = function () { App.setTheme(this.value); };

      function refreshPush() {
        App.pushState().then(function (s) {
          var label = { on: t('مفعّلة على هذا الجهاز', 'Enabled on this device'), off: t('غير مفعّلة', 'Off'), denied: t('محظورة من إعدادات المتصفح', 'Blocked in browser settings'), unsupported: t('غير مدعومة في هذا المتصفح', 'Not supported') }[s];
          App.$('#pushState').textContent = label;
          var b = App.$('#pushBtn');
          b.classList.toggle('d-none', s === 'unsupported' || s === 'denied');
          b.textContent = s === 'on' ? t('إيقاف', 'Turn off') : t('تفعيل', 'Turn on');
          b.className = 'btn btn-sm ' + (s === 'on' ? 'btn-label-secondary' : 'btn-primary');
          b.onclick = function () {
            App.busy(b, true);
            (s === 'on' ? App.unsubscribePush() : App.enablePush()).then(function () { App.toast(s === 'on' ? t('تم الإيقاف', 'Turned off') : t('تم التفعيل', 'Enabled')); })
              .catch(function (e) { App.toast(e.message, 'danger'); }).finally(function () { App.busy(b, false); refreshPush(); });
          };
          App.$('#testPush').classList.toggle('d-none', s !== 'on');
        });
      }
      refreshPush();
      App.$('#testPush').onclick = function () {
        navigator.serviceWorker.ready.then(function (reg) {
          reg.showNotification(t('إشعار تجريبي', 'Test notification'), { body: t('الإشعارات تعمل على هذا الجهاز ✅', 'Notifications work ✅'), icon: '/app/icons/icon-192.png', dir: App.lang() === 'ar' ? 'rtl' : 'ltr' });
        });
      };
      var showInstall = function () { App.$('#installBtn').classList.remove('d-none'); };
      if (App.installPrompt) showInstall();
      document.addEventListener('smi:installable', showInstall);
      App.$('#installBtn').onclick = function () { if (App.installPrompt) App.installPrompt.prompt(); };
      if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !navigator.standalone) App.$('#iosHint').classList.remove('d-none');
    })();
  </script>
</body>
</html>
