<!doctype html>
<html lang="ar" dir="rtl" class="light-style">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>انضمام طبيب — الهوية الطبية الذكية</title>
  <script src="/app/js/head.js"></script>
  <script src="/assets/vendor/js/helpers.js"></script>
</head>
<body>
  <div class="smi-auth wide">
    <div class="card shadow-lg">
      <div class="card-body p-4 p-sm-5">
        <div class="d-flex align-items-center gap-3 mb-4">
          <img src="/app/icons/icon-192.png" class="smi-auth-logo" alt="" />
          <div>
            <h4 class="mb-1" data-en="Join as a doctor">انضمام طبيب إلى المنصة</h4>
            <p class="text-muted mb-0 small" data-en="After the administration verifies your licence, patients can book with you online.">بعد توثيق ترخيصك من الإدارة سيتمكن المرضى من حجز مواعيد معك إلكترونياً.</p>
          </div>
        </div>
        <div class="alert alert-info small py-2"><i class="ti ti-info-circle me-1"></i><span data-en="This form is for doctors only. Patient accounts are created by the clinic staff.">هذا النموذج للأطباء فقط. حسابات المرضى يُنشئها الكادر الطبي في العيادة.</span></div>
        <form id="regForm" novalidate>
          <div class="row g-3">
            <div class="col-sm-6"><label class="form-label" data-en="First name">الاسم</label><input class="form-control" name="first_name" required /></div>
            <div class="col-sm-6"><label class="form-label" data-en="Last name">الكنية</label><input class="form-control" name="last_name" /></div>
            <div class="col-sm-6"><label class="form-label" data-en="Specialty">الاختصاص</label><select class="form-select" name="specialty" id="specialty" required></select></div>
            <div class="col-sm-6"><label class="form-label" data-en="City">المدينة</label><select class="form-select" name="city" id="city" required></select></div>
            <div class="col-sm-6"><label class="form-label" data-en="Licence number">رقم الترخيص / النقابة</label><input class="form-control" name="license_number" required /></div>
            <div class="col-sm-6"><label class="form-label" data-en="Phone">الهاتف</label><input class="form-control" name="phone" type="tel" dir="ltr" /></div>
            <div class="col-sm-6"><label class="form-label" data-en="Clinic name">اسم العيادة</label><input class="form-control" name="clinic_name" /></div>
            <div class="col-sm-6"><label class="form-label" data-en="Clinic address">عنوان العيادة</label><input class="form-control" name="address" /></div>
            <div class="col-12"><hr class="my-1" /></div>
            <div class="col-sm-6"><label class="form-label" data-en="Username (English)">اسم المستخدم (بالإنكليزية)</label><input class="form-control" name="username" dir="ltr" autocomplete="username" autocapitalize="none" required /></div>
            <div class="col-sm-6"><label class="form-label" data-en="Email">البريد الإلكتروني</label><input class="form-control" name="email" type="email" dir="ltr" /></div>
            <div class="col-sm-6 form-password-toggle"><label class="form-label" data-en="Password">كلمة المرور</label>
              <div class="input-group input-group-merge"><input class="form-control" name="password" type="password" autocomplete="new-password" required /><span class="input-group-text cursor-pointer"><i class="ti ti-eye-off"></i></span></div>
              <small class="text-muted" data-en="At least 8 characters, not only numbers">8 أحرف على الأقل، وليست أرقاماً فقط</small></div>
          </div>
          <button class="btn btn-primary w-100 mt-4" type="submit" id="regBtn" data-en="Create doctor account">إنشاء حساب الطبيب</button>
        </form>
        <p class="text-center mt-3 mb-0 small"><a href="/login.html" data-en="Back to sign in">العودة لتسجيل الدخول</a></p>
      </div>
    </div>
  </div>
  <script src="/app/js/core.js"></script>
  <script>
    App.applyI18n();
    window.Helpers.initPasswordToggle();
    App.meta().then(function (m) {
      App.$('#specialty').innerHTML = m.specialties.map(function (s) { return '<option value="' + s.code + '">' + App.esc(s.label) + '</option>'; }).join('');
      App.$('#city').innerHTML = m.cities.map(function (c) { return '<option>' + App.esc(c) + '</option>'; }).join('');
    });
    App.$('#regForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var form = this, btn = App.$('#regBtn'), data = App.formData(form);
      data.role = 'doctor';
      App.busy(btn, true);
      App.api('/register/', { method: 'POST', body: data, auth: false }).then(function (res) {
        App.setSession(res);
        location.replace('/pending.html');
      }).catch(function (err) { App.formErrors(form, err); App.busy(btn, false); });
    });
  </script>
</body>
</html>
