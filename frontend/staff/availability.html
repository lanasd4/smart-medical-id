<!doctype html>
<html lang="ar" dir="rtl" class="light-style layout-navbar-fixed layout-menu-fixed layout-compact" data-roles="Doctor" data-css="sweetalert2">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>أوقات الدوام</title>
  <script src="/app/js/head.js"></script>
  <script src="/assets/vendor/js/helpers.js"></script>
</head>
<body>
  <main id="page" data-title="أوقات الدوام والإعدادات" data-en-title="Working hours & settings">
    <div class="row g-4">
      <div class="col-xl-7">
        <div class="card mb-4">
          <div class="card-header d-flex justify-content-between align-items-center">
            <div><h5 class="card-title mb-0" data-en="Weekly schedule">جدول الدوام الأسبوعي</h5><small class="text-muted" data-en="Patients can only book inside these hours">يحجز المرضى ضمن هذه الأوقات فقط</small></div>
            <button class="btn btn-primary" id="saveHours"><i class="ti ti-device-floppy me-1"></i><span data-en="Save">حفظ الجدول</span></button>
          </div>
          <div class="card-body" id="week"></div>
        </div>
        <div class="card">
          <div class="card-header"><h5 class="card-title mb-0" data-en="Days off / holidays">أيام الإجازة</h5></div>
          <div class="card-body">
            <form class="row g-2 mb-3" id="offForm">
              <div class="col-sm-4"><input class="form-control" type="date" name="date" required /></div>
              <div class="col-sm-6"><input class="form-control" name="reason" placeholder="السبب (اختياري)" data-en-ph="Reason (optional)" /></div>
              <div class="col-sm-2"><button class="btn btn-label-primary w-100" type="submit" data-en="Add">إضافة</button></div>
            </form>
            <ul class="list-group" id="offList"></ul>
          </div>
        </div>
      </div>
      <div class="col-xl-5">
        <div class="card mb-4">
          <div class="card-header"><h5 class="card-title mb-0" data-en="Booking settings">إعدادات الحجز</h5></div>
          <div class="card-body">
            <form id="settingsForm" class="row g-3">
              <div class="col-12">
                <div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="accepts_online_booking" id="s1" /><label class="form-check-label" for="s1" data-en="Accept online bookings">استقبال الحجوزات الإلكترونية</label></div>
              </div>
              <div class="col-12">
                <label class="form-label" data-en="When a patient picks a slot">عند اختيار المريض لموعد</label>
                <div class="form-check custom-option custom-option-basic mb-2"><label class="form-check-label custom-option-content" for="ra1"><input class="form-check-input" type="radio" name="requires_approval" value="true" id="ra1" />
                  <span class="custom-option-header"><span class="fw-medium" data-en="Needs approval">يحتاج موافقة</span></span><span class="custom-option-body"><small data-en="The slot is held; you or your nurse approve it, then the patient is notified.">يُحجز الوقت للمريض، وتوافق أنت أو الممرض فيُثبَّت ويُبلَّغ المريض.</small></span></label></div>
                <div class="form-check custom-option custom-option-basic"><label class="form-check-label custom-option-content" for="ra2"><input class="form-check-input" type="radio" name="requires_approval" value="false" id="ra2" />
                  <span class="custom-option-header"><span class="fw-medium" data-en="Confirm instantly">تثبيت فوري</span></span><span class="custom-option-body"><small data-en="The appointment is confirmed immediately.">يُثبَّت الموعد مباشرة دون انتظار.</small></span></label></div>
              </div>
              <div class="col-6"><label class="form-label" data-en="Appointment length">مدة الموعد</label>
                <select class="form-select" name="slot_minutes"><option value="10">10</option><option value="15">15</option><option value="20">20</option><option value="30">30</option><option value="45">45</option><option value="60">60</option></select></div>
              <div class="col-6"><label class="form-label" data-en="Booking window (days)">الحجز مسبقاً حتى (يوم)</label><input class="form-control" type="number" min="1" max="120" name="booking_window_days" /></div>
              <div class="col-12"><hr class="my-1" /></div>
              <div class="col-12"><label class="form-label" data-en="Clinic name">اسم العيادة</label><input class="form-control" name="clinic_name" /></div>
              <div class="col-6"><label class="form-label" data-en="City">المدينة</label><select class="form-select" name="city" id="citySel"></select></div>
              <div class="col-6"><label class="form-label" data-en="Specialty">الاختصاص</label><select class="form-select" name="specialty" id="specSel"></select></div>
              <div class="col-12"><label class="form-label" data-en="Address">العنوان</label><input class="form-control" name="address" /></div>
              <div class="col-6"><label class="form-label" data-en="Phone">الهاتف</label><input class="form-control" name="phone" dir="ltr" /></div>
              <div class="col-6"><label class="form-label" data-en="Fee">أجرة المعاينة</label><input class="form-control" name="consultation_fee" type="number" min="0" /></div>
              <div class="col-6"><label class="form-label" data-en="Years of experience">سنوات الخبرة</label><input class="form-control" name="years_experience" type="number" min="0" /></div>
              <div class="col-12"><label class="form-label" data-en="About">نبذة</label><textarea class="form-control" name="bio" rows="3"></textarea></div>
              <div class="col-12"><button class="btn btn-primary w-100" type="submit" data-en="Save settings">حفظ الإعدادات</button></div>
            </form>
          </div>
        </div>
        <div class="card">
          <div class="card-body">
            <h6 class="smi-section-title"><i class="ti ti-nurse"></i><span data-en="Nurses who can approve your bookings">الممرضون المخوّلون بالموافقة على حجوزاتك</span></h6>
            <div id="nurses" class="small"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="/assets/vendor/core.bundle.js"></script>
  <script src="/assets/vendor/libs/sweetalert2/sweetalert2.js"></script>
  <script src="/app/js/core.js"></script>
  <script src="/app/js/shell.js"></script>
  <script>
    (function () {
      var t = App.t, esc = App.esc, ORDER = [5, 6, 0, 1, 2, 3, 4], periods = {}, WD = App.WEEKDAYS();

      function renderWeek() {
        App.$('#week').innerHTML = ORDER.map(function (wd) {
          var list = periods[wd] || [], on = list.length > 0;
          return '<div class="border-bottom py-3" data-wd="' + wd + '"><div class="d-flex align-items-center justify-content-between mb-2">' +
            '<div class="form-check form-switch mb-0"><input class="form-check-input day-toggle" type="checkbox" id="d' + wd + '"' + (on ? ' checked' : '') + ' /><label class="form-check-label fw-medium" for="d' + wd + '">' + esc(WD[wd]) + '</label></div>' +
            (on ? '<button class="btn btn-sm btn-text-primary add-period"><i class="ti ti-plus ti-xs me-1"></i>' + esc(t('فترة', 'Period')) + '</button>' : '<small class="text-muted">' + esc(t('عطلة', 'Off')) + '</small>') + '</div>' +
            list.map(function (p, i) {
              return '<div class="d-flex align-items-center gap-2 mb-2" data-i="' + i + '"><input type="time" class="form-control form-control-sm p-start" value="' + p[0] + '" style="max-width:130px" />' +
                '<span>—</span><input type="time" class="form-control form-control-sm p-end" value="' + p[1] + '" style="max-width:130px" />' +
                '<button class="btn btn-sm btn-icon btn-text-danger del-period"><i class="ti ti-trash"></i></button></div>';
            }).join('') + '</div>';
        }).join('');
        App.$$('[data-wd]').forEach(function (row) {
          var wd = +row.dataset.wd;
          row.querySelector('.day-toggle').onchange = function () { periods[wd] = this.checked ? [['09:00', '14:00']] : []; renderWeek(); };
          var add = row.querySelector('.add-period');
          if (add) add.onclick = function () { var l = periods[wd], last = l[l.length - 1]; l.push([last ? last[1] : '16:00', last ? addHours(last[1], 2) : '18:00']); renderWeek(); };
          App.$$('[data-i]', row).forEach(function (pr) {
            var i = +pr.dataset.i;
            pr.querySelector('.p-start').onchange = function () { periods[wd][i][0] = this.value; };
            pr.querySelector('.p-end').onchange = function () { periods[wd][i][1] = this.value; };
            pr.querySelector('.del-period').onclick = function () { periods[wd].splice(i, 1); renderWeek(); };
          });
        });
      }
      function addHours(hm, h) { var p = hm.split(':'); return String(Math.min(23, +p[0] + h)).padStart(2, '0') + ':' + p[1]; }

      function renderOff(list) {
        App.$('#offList').innerHTML = list.length ? list.map(function (o) {
          return '<li class="list-group-item d-flex justify-content-between align-items-center"><span><i class="ti ti-beach me-2 text-warning"></i>' + esc(App.fmtDay(o.date + 'T12:00:00')) +
            (o.reason ? ' <small class="text-muted">— ' + esc(o.reason) + '</small>' : '') + '</span><button class="btn btn-sm btn-icon btn-text-danger" data-off="' + o.id + '"><i class="ti ti-trash"></i></button></li>';
        }).join('') : '<li class="list-group-item text-muted small">' + esc(t('لا توجد إجازات قادمة', 'No upcoming days off')) + '</li>';
        App.$$('[data-off]').forEach(function (b) { b.onclick = function () { App.del('/doctors/me/time-off/' + b.dataset.off + '/').then(loadOff); }; });
      }
      function loadOff() { App.get('/doctors/me/time-off/').then(renderOff); }

      Promise.all([App.get('/doctors/me/'), App.meta()]).then(function (res) {
        var p = res[0], m = res[1];
        App.$('#citySel').innerHTML = m.cities.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('');
        App.$('#specSel').innerHTML = m.specialties.map(function (s) { return '<option value="' + s.code + '">' + esc(s.label) + '</option>'; }).join('');
        p.availability.forEach(function (a) { (periods[a.weekday] = periods[a.weekday] || []).push([a.start_time.slice(0, 5), a.end_time.slice(0, 5)]); });
        renderWeek();
        var f = App.$('#settingsForm');
        App.fillForm(f, p);
        (p.requires_approval ? App.$('#ra1') : App.$('#ra2')).checked = true;
        App.$('#nurses').innerHTML = p.nurse_names.length ? p.nurse_names.map(function (n) { return '<span class="badge bg-label-success me-1 mb-1">' + esc(n) + '</span>'; }).join('')
          : '<span class="text-muted">' + esc(t('لم تُحدَّد ممرضات لك بعد، لذلك تصل طلباتك لجميع الممرضين. يمكن للإدارة تخصيصهم.', 'No nurses assigned yet, so all nurses receive your requests. The admin can assign them.')) + '</span>';
        renderOff(p.time_off);
      });

      App.$('#saveHours').onclick = function () {
        var rows = [], btn = this;
        Object.keys(periods).forEach(function (wd) { periods[wd].forEach(function (p) { rows.push({ weekday: +wd, start_time: p[0], end_time: p[1] }); }); });
        App.busy(btn, true);
        App.put('/doctors/me/availability/', rows).then(function () { App.toast(t('تم حفظ الجدول', 'Schedule saved')); })
          .catch(function (e) { App.toast(e.message, 'danger'); }).finally(function () { App.busy(btn, false); });
      };
      App.$('#settingsForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var f = this, d = App.formData(f), btn = f.querySelector('[type=submit]');
        d.requires_approval = d.requires_approval === 'true';
        ['consultation_fee', 'years_experience'].forEach(function (k) { if (d[k] === '') d[k] = null; });
        App.busy(btn, true);
        App.patch('/doctors/me/', d).then(function () { App.toast(t('تم الحفظ', 'Saved')); })
          .catch(function (err) { App.formErrors(f, err); }).finally(function () { App.busy(btn, false); });
      });
      App.$('#offForm').addEventListener('submit', function (e) {
        e.preventDefault(); var f = this;
        App.post('/doctors/me/time-off/', App.formData(f)).then(function (l) { f.reset(); renderOff(l); }).catch(function (err) { App.formErrors(f, err); });
      });
    })();
  </script>
</body>
</html>
