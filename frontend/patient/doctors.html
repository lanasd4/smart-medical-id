<!doctype html>
<html lang="ar" dir="rtl" class="light-style layout-navbar-fixed layout-menu-fixed layout-compact" data-roles="Patient">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>دليل الأطباء</title>
  <script src="/app/js/head.js"></script>
  <script src="/assets/vendor/js/helpers.js"></script>
</head>
<body>
  <main id="page" data-title="دليل الأطباء" data-en-title="Find a doctor">
    <div class="alert alert-info d-none align-items-center gap-2" id="triageHint"></div>
    <div class="card mb-4">
      <div class="card-body">
        <form class="row g-3 align-items-end" id="filters">
          <div class="col-md-4">
            <label class="form-label" data-en="Search">بحث</label>
            <div class="input-group input-group-merge"><span class="input-group-text"><i class="ti ti-search"></i></span>
              <input class="form-control" name="search" placeholder="اسم الطبيب أو العيادة" data-en-ph="Doctor or clinic name" /></div>
          </div>
          <div class="col-md-3 col-6"><label class="form-label" data-en="Specialty">الاختصاص</label><select class="form-select" name="specialty" id="fSpecialty"></select></div>
          <div class="col-md-3 col-6"><label class="form-label" data-en="City">المدينة</label><select class="form-select" name="city" id="fCity"></select></div>
          <div class="col-md-2">
            <div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" name="bookable" id="fBookable" />
              <label class="form-check-label small" for="fBookable" data-en="Online booking only">الحجز الإلكتروني فقط</label></div>
          </div>
        </form>
      </div>
    </div>
    <p class="text-muted small mb-3" id="resultCount"></p>
    <div class="row g-4" id="list"></div>
    <div class="text-center mt-4"><button class="btn btn-label-primary d-none" id="more" data-en="Load more">عرض المزيد</button></div>
  </main>
  <script src="/assets/vendor/core.bundle.js"></script>
  <script src="/app/js/core.js"></script>
  <script src="/app/js/shell.js"></script>
  <script>
    (function () {
      var t = App.t, esc = App.esc, form = App.$('#filters'), list = App.$('#list'), page = 1, triage = App.qs('triage');
      App.meta().then(function (m) {
        App.$('#fSpecialty').innerHTML = '<option value="">' + esc(t('كل الاختصاصات', 'All specialties')) + '</option>' +
          m.specialties.map(function (s) { return '<option value="' + s.code + '">' + esc(s.label) + '</option>'; }).join('');
        App.$('#fCity').innerHTML = '<option value="">' + esc(t('كل المدن', 'All cities')) + '</option>' + m.cities.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('');
        if (App.qs('specialty')) {
          App.$('#fSpecialty').value = App.qs('specialty');
          var label = (m.specialties.find(function (s) { return s.code === App.qs('specialty'); }) || {}).label;
          var hint = App.$('#triageHint');
          hint.innerHTML = '<i class="ti ti-message-chatbot"></i><span>' + esc(t('حسب الدليل الصحي، الاختصاص المناسب لحالتك: ', 'Recommended by the health guide: ')) + '<strong>' + esc(label) + '</strong></span>';
          hint.classList.remove('d-none'); hint.classList.add('d-flex');
        }
        load(true);
      });

      function card(d) {
        var bookUrl = '/patient/book.html?doctor=' + d.id + (triage ? '&triage=' + encodeURIComponent(triage) : '');
        return '<div class="col-md-6 col-xl-4"><div class="card h-100 smi-doctor-card"><div class="card-body d-flex flex-column">' +
          '<div class="d-flex gap-3 mb-3">' + App.avatar(d.full_name, d.can_book ? 'primary' : 'secondary', 'avatar-xl') +
          '<div class="overflow-hidden"><h5 class="mb-1 text-truncate">' + esc(t('د. ', 'Dr. ') + d.full_name) + '</h5>' +
          '<span class="badge bg-label-primary mb-1">' + esc(d.specialty_label) + '</span><br />' +
          (d.can_book ? '<span class="badge bg-success"><i class="ti ti-calendar-check ti-xs me-1"></i>' + esc(t('حجز إلكتروني', 'Online booking')) + '</span>'
                      : '<span class="badge bg-label-secondary">' + esc(t('غير مشترك — معلومات فقط', 'Info only')) + '</span>') + '</div></div>' +
          '<ul class="list-unstyled small mb-3 flex-grow-1">' +
          (d.clinic_name ? '<li class="mb-1"><i class="ti ti-building-hospital ti-xs me-1 text-muted"></i>' + esc(d.clinic_name) + '</li>' : '') +
          '<li class="mb-1"><i class="ti ti-map-pin ti-xs me-1 text-muted"></i>' + esc([d.city, d.address].filter(Boolean).join(' — ') || '—') + '</li>' +
          (d.years_experience ? '<li class="mb-1"><i class="ti ti-award ti-xs me-1 text-muted"></i>' + esc(t('خبرة ' + d.years_experience + ' سنة', d.years_experience + ' years experience')) + '</li>' : '') +
          (d.consultation_fee ? '<li class="mb-1"><i class="ti ti-cash ti-xs me-1 text-muted"></i>' + esc(t('أجرة المعاينة: ', 'Fee: ')) + '<span class="ltr">' + Number(d.consultation_fee).toLocaleString() + '</span></li>' : '') +
          (d.bio ? '<li class="text-muted mt-2">' + esc(d.bio.slice(0, 140)) + '</li>' : '') + '</ul>' +
          '<div class="d-flex gap-2">' +
          (d.can_book ? '<a class="btn btn-primary flex-grow-1" href="' + bookUrl + '"><i class="ti ti-calendar-plus me-1"></i>' + esc(t('احجز موعداً', 'Book')) + '</a>' : '') +
          (d.phone ? '<a class="btn btn-label-secondary ' + (d.can_book ? '' : 'flex-grow-1') + '" href="tel:' + esc(d.phone) + '"><i class="ti ti-phone me-1"></i><span class="ltr">' + esc(d.phone) + '</span></a>' : '') +
          '</div></div></div></div>';
      }

      function load(reset) {
        if (reset) { page = 1; App.spinner(list); }
        var f = App.formData(form);
        App.get('/doctors/', { search: f.search, specialty: f.specialty, city: f.city, bookable: f.bookable ? 1 : '', page: page, page_size: 12 }).then(function (d) {
          if (reset) list.innerHTML = '';
          if (!d.count) { App.empty(list, t('لا يوجد أطباء مطابقون للبحث', 'No doctors match your search'), 'ti-stethoscope-off'); }
          list.insertAdjacentHTML('beforeend', d.results.map(card).join(''));
          App.$('#resultCount').textContent = t(d.count + ' طبيب', d.count + ' doctors');
          App.$('#more').classList.toggle('d-none', !d.next);
        }).catch(function (e) { App.errorBox(list, e); });
      }
      form.addEventListener('input', App.debounce(function () { load(true); }, 350));
      form.addEventListener('submit', function (e) { e.preventDefault(); load(true); });
      App.$('#more').onclick = function () { page++; load(false); };
    })();
  </script>
</body>
</html>
